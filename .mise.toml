[tools]
python = "3.11.9"

[tasks.contracts]
description = "Tier 0 gate: KV geometry, rotary ladders, layer and token alignment"
dir = "{{config_root}}"
run = [
  "python tests/test_static_names.py",
  "python tests/test_alignment.py",
  "python scripts/capture_contracts.py",
  "python tests/test_contracts.py",
]

[tasks.substrate]
description = "Tier 1 gate: an injected cache is read, and position ids are absolute"
dir = "{{config_root}}"
run = [
  "python tests/test_static_names.py",
  "python tests/test_cache_ops.py",
  "python scripts/capture_substrate.py",
  "python tests/test_substrate.py",
]

[tasks.geometry]
description = "Tier 2 gate: both caches at the contract shapes, and the null the training is graded against"
dir = "{{config_root}}"
run = [
  "python tests/test_static_names.py",
  "python tests/test_cache_ops.py",
  "python scripts/capture_dual_cache.py",
  "python tests/test_geometry.py",
]

[tasks.train]
description = "Tier 3 gate: a projection beats a constant predictor on data it did not see"
dir = "{{config_root}}"
run = [
  "python tests/test_static_names.py",
  "python tests/test_cache_ops.py",
  "python tests/test_projection.py",
  "python scripts/train_projection.py",
  "python tests/test_train.py",
]

[tasks.analysis]
description = "Tier 3 gate: accuracy, once, with a paired interval and a paired test"
dir = "{{config_root}}"
run = [
  "python tests/test_static_names.py",
  "python tests/test_projection.py",
  "python scripts/analysis.py",
  "python tests/test_analysis.py",
]

[tasks.shift]
description = "Probe, not a gate: does a projection fitted on wikitext carry to MMLU"
dir = "{{config_root}}"
run = [
  "python tests/test_static_names.py",
  "python scripts/probe_distribution_shift.py",
]

[tasks.parity]
description = "Probe, not a gate: does the receiver key cache split along the sharer's rotary ladder"
dir = "{{config_root}}"
run = [
  "python tests/test_static_names.py",
  "python scripts/probe_rotary_parity.py",
]

[tasks.fuser-substrate]
description = "Tier 5 gate: a shut fuser is a no-op, and the loss reaches it"
dir = "{{config_root}}"
run = [
  "python tests/test_static_names.py",
  "python tests/test_cache_ops.py",
  "python tests/test_fuser.py",
  "python scripts/capture_fuser_substrate.py",
  "python tests/test_fuser_substrate.py",
]

[tasks.fuser]
description = "Tier 5: train the fuser, and the replacement arm that prices it"
dir = "{{config_root}}"
depends = ["fuser-substrate"]
run = [
  "python tests/test_static_names.py",
  "python scripts/train_fuser.py",
]

[tasks.probe-letter-mass]
description = "Where the fused run's loss drop went: the right letter, or a letter at all"
dir = "{{config_root}}"
run = ["python scripts/probe_letter_mass.py"]